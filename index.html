<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGRRUB - Gen Z Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🛍️ IGRRUB</h1>
            <p class="tagline">Shop like it's 2026</p>
        </div>
    </nav>

    <div class="container">
        <div class="calculator-card">
            <h2>Price Calculator</h2>
            <div class="form-group">
                <label for="basePrice">Base Price (USD):</label>
                <input type="number" id="basePrice" placeholder="e.g., 100" min="0">
            </div>
            <button onclick="calculatePrice()">Calculate Price</button>
            <div id="result" class="result"></div>
        </div>

        <div class="products-grid">
            <h2>Featured Products</h2>
            <div class="grid">
                <div class="product-card">
                    <div class="product-image">📱</div>
                    <h3>Wireless Earbuds</h3>
                    <p>Base: $45</p>
                    <button onclick="calculatePrice('45')">Calculate</button>
                </div>
                <div class="product-card">
                    <div class="product-image">⌚</div>
                    <h3>Smart Watch</h3>
                    <p>Base: $89</p>
                    <button onclick="calculatePrice('89')">Calculate</button>
                </div>
                <div class="product-card">
                    <div class="product-image">🎧</div>
                    <h3>Headphones</h3>
                    <p>Base: $120</p>
                    <button onclick="calculatePrice('120')">Calculate</button>
                </div>
                <div class="product-card">
                    <div class="product-image">📷</div>
                    <h3>Phone Camera Lens</h3>
                    <p>Base: $65</p>
                    <button onclick="calculatePrice('65')">Calculate</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 IGRRUB - Your Gen Z Marketplace</p>
    </footer>

    <script src="calculator.js"></script>
</body>
</html>
